[target.aarch64-apple-darwin]
linker = "clang"
rustflags = [
    "-C",
    "target-cpu=native",
    "-C",
    "link-arg=-fuse-ld=/opt/homebrew/opt/lld/bin/ld64.lld",
    "-C",
    "link-arg=-Wl,-rpath,@loader_path",
    "-C",
    "link-arg=-Wl,-rpath,@loader_path/deps",
]

[target.x86_64-apple-darwin]
rustflags = [
    "-C",
    "link-arg=-Wl,-rpath,@loader_path",
    "-C",
    "link-arg=-Wl,-rpath,@loader_path/deps",
]

[target.x86_64-unknown-linux-gnu]
rustflags = [
    "-C",
    "link-arg=-Wl,-rpath,$ORIGIN",
    "-C",
    "link-arg=-Wl,-rpath,$ORIGIN/deps",
]

[target.aarch64-unknown-linux-gnu]
rustflags = [
    "-C",
    "link-arg=-Wl,-rpath,$ORIGIN",
    "-C",
    "link-arg=-Wl,-rpath,$ORIGIN/deps",
]
