name: Slow Quality

on:
  schedule:
    - cron: "23 8 * * 1"
  workflow_dispatch:

concurrency:
  group: slow-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  security-events: write

env:
  CARGO_TERM_COLOR: always
  DUCKDB_DOWNLOAD_LIB: "1"

jobs:
  compile-lint:
    name: Compile and lint
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: slow-compile
          cache-directories: target/duckdb-download
      - name: Validate cached DuckDB link input
        run: bash .github/scripts/ensure-duckdb-link-input.sh
      - name: Prepare reports
        run: mkdir -p target/quality/reports
      - name: Dependency metadata sanity
        run: |
          cargo metadata --format-version 1 --locked > target/quality/reports/cargo-metadata-slow.json
          cargo tree --workspace --locked > target/quality/reports/cargo-tree-slow.txt
          cargo tree --workspace --locked -d > target/quality/reports/cargo-tree-duplicates-slow.txt
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Compile checks
        run: |
          cargo check --workspace --all-targets --locked
          cargo check --workspace --all-targets --all-features --locked
          cargo check --workspace --all-targets --no-default-features --locked
      - name: Clippy checks
        run: |
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Upload compile reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slow-compile-reports
          path: target/quality/reports
          if-no-files-found: ignore

  unit-tests:
    name: Workspace tests
    runs-on: ubuntu-latest
    timeout-minutes: 120
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_USER: cdf
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cdf -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://cdf@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: slow-tests
          cache-directories: target/duckdb-download
      - name: Validate cached DuckDB link input
        run: bash .github/scripts/ensure-duckdb-link-input.sh
      - name: Install nextest
        run: cargo install --locked cargo-nextest
      - name: Workspace tests excluding dedicated conformance shards
        run: >-
          cargo nextest run --workspace --exclude cdf-benchmarks
          --exclude cdf-conformance --locked
      - name: Documentation tests
        run: cargo test --workspace --doc --all-features --locked --no-fail-fast

  conformance-general:
    name: Conformance general
    runs-on: ubuntu-latest
    timeout-minutes: 120
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_USER: cdf
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cdf -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://cdf@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: slow-conformance
          cache-directories: target/duckdb-download
      - name: Validate cached DuckDB link input
        run: bash .github/scripts/ensure-duckdb-link-input.sh
      - name: Install nextest
        run: cargo install --locked cargo-nextest
      - name: General conformance laws
        run: cargo nextest run -p cdf-conformance --locked

  conformance_shard_plan:
    name: Resolve conformance shards
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sources: ${{ steps.shards.outputs.sources }}
      chaos_destinations: ${{ steps.shards.outputs.chaos_destinations }}
    steps:
      - uses: actions/checkout@v4
      - name: Read checked source shards
        id: shards
        run: |
          echo "sources=$(jq -c . crates/cdf-conformance/run-matrix-shards.json)" >> "$GITHUB_OUTPUT"
          echo "chaos_destinations=$(jq -c . crates/cdf-conformance/runtime-chaos-shards.json)" >> "$GITHUB_OUTPUT"

  conformance-matrix:
    name: Run matrix (${{ matrix.source }})
    needs: conformance_shard_plan
    strategy:
      fail-fast: false
      matrix:
        source: ${{ fromJSON(needs.conformance_shard_plan.outputs.sources) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_USER: cdf
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cdf -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CDF_RUN_MATRIX_SOURCE: ${{ matrix.source }}
      TEST_DATABASE_URL: postgresql://cdf@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: slow-conformance
          cache-directories: target/duckdb-download
      - name: Validate cached DuckDB link input
        run: bash .github/scripts/ensure-duckdb-link-input.sh
      - name: Prepare reports
        run: mkdir -p target/quality/reports
      - name: Run source shard
        run: |
          set -o pipefail
          echo "CDF_RUN_MATRIX_SHARD_START=${CDF_RUN_MATRIX_SOURCE}"
          timeout --signal=TERM --kill-after=30s 40m cargo test -p cdf-conformance \
            run_matrix::tests::registered_source_shard_cells_persist_output \
            --locked -- --ignored --exact --nocapture --test-threads=1 \
            2>&1 | tee "target/quality/reports/run-matrix-${CDF_RUN_MATRIX_SOURCE}.log"
      - name: Upload source-shard report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-matrix-${{ matrix.source }}
          path: target/quality/reports/run-matrix-${{ matrix.source }}.log
          if-no-files-found: warn

  conformance-repeats:
    name: Determinism repeat (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: golden-package
            test: golden_package::tests::prepared_orders_v1_matches_committed_golden_across_100_rebuilds
          - name: live-duckdb
            test: live_run::tests::live_local_file_duckdb_v1_matches_committed_golden_across_100_runs
          - name: live-parquet
            test: live_run::tests::live_local_file_parquet_v1_matches_committed_golden_across_100_runs
          - name: live-postgres
            test: live_run::tests::live_local_file_postgres_v1_matches_committed_golden_across_bounded_repeats
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_USER: cdf
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cdf -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://cdf@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: slow-conformance
          cache-directories: target/duckdb-download
      - name: Validate cached DuckDB link input
        run: bash .github/scripts/ensure-duckdb-link-input.sh
      - name: Prepare reports
        run: mkdir -p target/quality/reports
      - name: Run repeat law
        env:
          CDF_REPEAT_TEST: ${{ matrix.test }}
          CDF_REPEAT_NAME: ${{ matrix.name }}
        run: |
          set -o pipefail
          echo "CDF_REPEAT_SHARD_START=${CDF_REPEAT_NAME}"
          timeout --signal=TERM --kill-after=30s 55m cargo test -p cdf-conformance "$CDF_REPEAT_TEST" \
            --locked -- --ignored --exact --nocapture --test-threads=1 \
            2>&1 | tee "target/quality/reports/repeat-${CDF_REPEAT_NAME}.log"
      - name: Upload repeat report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repeat-${{ matrix.name }}
          path: target/quality/reports/repeat-${{ matrix.name }}.log
          if-no-files-found: warn

  conformance-chaos:
    name: Runtime chaos (${{ matrix.destination }})
    needs: conformance_shard_plan
    strategy:
      fail-fast: false
      matrix:
        destination: ${{ fromJSON(needs.conformance_shard_plan.outputs.chaos_destinations) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_USER: cdf
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cdf -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CDF_RUNTIME_CHAOS_DESTINATION: ${{ matrix.destination }}
      TEST_DATABASE_URL: postgresql://cdf@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: slow-conformance
          cache-directories: target/duckdb-download
      - name: Validate cached DuckDB link input
        run: bash .github/scripts/ensure-duckdb-link-input.sh
      - name: Prepare reports
        run: mkdir -p target/quality/reports
      - name: Run destination chaos shard
        run: |
          set -o pipefail
          echo "CDF_RUNTIME_CHAOS_SHARD_START=${CDF_RUNTIME_CHAOS_DESTINATION}"
          timeout --signal=TERM --kill-after=30s 40m cargo test -p cdf-conformance \
            runtime_chaos::tests::registered_destination_shard_runtime_stage_chaos_persists_output \
            --locked -- --ignored --exact --nocapture --test-threads=1 \
            2>&1 | tee "target/quality/reports/runtime-chaos-${CDF_RUNTIME_CHAOS_DESTINATION}.log"
      - name: Upload destination-chaos report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-chaos-${{ matrix.destination }}
          path: target/quality/reports/runtime-chaos-${{ matrix.destination }}.log
          if-no-files-found: warn

  generated-api:
    name: Generated artifacts and public API
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: slow-generated-api
          cache-directories: target/duckdb-download
      - name: Validate cached DuckDB link input
        run: bash .github/scripts/ensure-duckdb-link-input.sh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install API tool
        run: cargo install --locked cargo-semver-checks
      - name: Generated CLI artifact freshness
        run: cargo test -p cdf-cli-core --locked --features cli-artifacts cli_generated_artifacts_match_committed_snapshots
      - name: Generated command and error reference freshness
        run: cargo run -p cdf-cli-core --locked --features cli-artifacts --bin cdf-generate-cli-artifacts -- --docs-dir docs --docs-only --check
      - name: Generated memory owner matrix freshness
        run: python tools/generate-memory-owner-matrix.py --check --require-closed
      - name: Public API compatibility
        run: cargo semver-checks --workspace --baseline-rev origin/${{ github.event.repository.default_branch }}

  quality-metrics:
    name: Coverage and maintainability metrics
    runs-on: ubuntu-latest
    timeout-minutes: 120
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_USER: cdf
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cdf -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://cdf@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: slow-metrics
          cache-directories: target/duckdb-download
      - name: Validate cached DuckDB link input
        run: bash .github/scripts/ensure-duckdb-link-input.sh
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install metrics tools
        run: |
          cargo install --locked cargo-llvm-cov
          cargo install --locked cargo-machete
          cargo install --locked rust-code-analysis-cli
      - name: Prepare reports
        run: mkdir -p target/quality/reports
      - name: Coverage summary
        run: cargo llvm-cov --workspace --all-features --locked --summary-only
      - name: Duplication check
        if: always()
        run: |
          npx --yes jscpd@5 crates examples tools \
            --reporters json,console \
            --output target/quality/reports/jscpd-slow \
            --ignore "**/target/**,**/reports/**,**/generated/**" \
            --min-lines 12 \
            --min-tokens 80 \
            --threshold 10 \
            --no-colors
      - name: Rust complexity metrics
        if: always()
        run: |
          mkdir -p target/quality/reports/rust-code-analysis-slow
          rust-code-analysis-cli -m -p crates -O json -o target/quality/reports/rust-code-analysis-slow
      - name: Dependency hygiene inventory
        if: always()
        continue-on-error: true
        run: |
          set -o pipefail
          cargo machete --with-metadata 2>&1 | tee target/quality/reports/cargo-machete-slow.log
      - name: Upload metrics reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slow-quality-metrics
          path: target/quality/reports
          if-no-files-found: ignore

  supply-chain:
    name: Supply-chain policy
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Install supply-chain tools
        run: |
          cargo install --locked cargo-audit
          cargo install --locked cargo-deny
          cargo install --locked cargo-vet
          go install github.com/google/osv-scanner/cmd/osv-scanner@v1.9.2
      - name: Prepare reports
        run: mkdir -p target/quality/reports
      - name: Cargo deny
        run: cargo deny --locked check
      - name: Cargo audit
        if: always()
        run: cargo audit --deny warnings --ignore RUSTSEC-2024-0436
      - name: Cargo vet
        if: always()
        run: cargo vet --locked --no-minimize-exemptions
      - name: OSV scan
        if: always()
        run: |
          set +e
          osv-scanner scan \
            --lockfile Cargo.lock \
            --format json \
            --output target/quality/reports/osv-slow.json
          osv_status=$?
          set -e
          jq -e '
            (.results | type == "array")
            and ([.. | objects | select(has("id")) | .id] | unique
                 | all(. == "RUSTSEC-2024-0436"))
          ' target/quality/reports/osv-slow.json
          if [[ "$osv_status" -ne 0 ]]; then
            echo "OSV reported only the ratified RUSTSEC-2024-0436 exception."
          fi
      - name: Upload supply-chain reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slow-supply-chain-reports
          path: target/quality/reports
          if-no-files-found: ignore

  security-static:
    name: Static security analysis
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install static security tools
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.18.4
          python -m pip install --user semgrep
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Prepare reports
        run: mkdir -p target/quality/reports
      - name: Semgrep informational inventory
        run: |
          semgrep scan \
            --config p/rust \
            --json \
            --output target/quality/reports/semgrep-rust-slow.json \
            --exclude target \
            --exclude reports \
            .
      - name: Semgrep warning and error gate
        run: |
          semgrep scan \
            --config p/rust \
            --error \
            --severity WARNING \
            --severity ERROR \
            --json \
            --output target/quality/reports/semgrep-rust-blocking-slow.json \
            --exclude target \
            --exclude reports \
            .
      - name: Source-only secret scan
        if: always()
        run: |
          source_tree="$(mktemp -d)"
          trap 'rm -rf "$source_tree"' EXIT
          git archive --format=tar HEAD | tar -xf - -C "$source_tree"
          gitleaks detect \
            --no-git \
            --source "$source_tree" \
            --no-banner \
            --redact \
            --report-format json \
            --report-path target/quality/reports/gitleaks-dir-slow.json
      - name: Initialize CodeQL
        if: always()
        uses: github/codeql-action/init@v3
        with:
          languages: rust
          build-mode: none
      - name: CodeQL Rust analysis
        if: always()
        uses: github/codeql-action/analyze@v3
      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slow-security-reports
          path: target/quality/reports
          if-no-files-found: ignore
