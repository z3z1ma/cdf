name: Release Artifacts

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without leading v"
        required: true
        default: "0.2.0-alpha.1"
      upload_github_prerelease:
        description: "Upload artifacts to a GitHub prerelease"
        required: true
        type: boolean
        default: false
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

concurrency:
  group: release-artifacts-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  metadata:
    name: Release metadata
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.value }}
      upload_github_prerelease: ${{ steps.upload.outputs.value }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${{ inputs.version }}"
          fi
          if [[ -z "$version" || "$version" == v* ]]; then
            echo "release version must be nonempty and must not include leading v" >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Resolve upload mode
        id: upload
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ inputs.upload_github_prerelease }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate release metadata
        run: tools/verify-release-metadata.sh "${{ steps.version.outputs.value }}"

      - name: Confirm crates.io publication remains disabled
        shell: bash
        run: |
          publish_pattern='cargo publi[s]h|cargo logi[n]'
          if grep -RE "$publish_pattern" .github/workflows tools; then
            echo "release workflow must not publish crates while DataFusion remains pinned to git" >&2
            exit 1
          fi
          echo "crates.io publication disabled"

  cli-artifacts:
    name: Canonical CLI artifacts
    needs: metadata
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Python archive runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Cache Cargo builds
        uses: Swatinem/rust-cache@v2
        with:
          key: release-cli-artifacts

      - name: Check generated CLI artifact freshness
        run: cargo run -p cdf-cli-core --locked --features cli-artifacts --bin cdf-generate-cli-artifacts -- --out-dir crates/cdf-cli/generated --check

      - name: Generate canonical CLI artifacts
        run: cargo run -p cdf-cli-core --locked --features cli-artifacts --bin cdf-generate-cli-artifacts -- --out-dir target/generated

      - name: Upload canonical CLI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cdf-${{ needs.metadata.outputs.version }}-cli-artifacts
          path: target/generated
          if-no-files-found: error

  build:
    name: Build ${{ matrix.target }}
    needs:
      - metadata
      - cli-artifacts
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            binary: cdf
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            binary: cdf
          - target: x86_64-apple-darwin
            os: macos-15-intel
            binary: cdf
          - target: aarch64-apple-darwin
            os: macos-15
            binary: cdf
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            binary: cdf.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Python archive runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Cache Cargo builds
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Validate release metadata
        shell: bash
        run: tools/verify-release-metadata.sh "${{ needs.metadata.outputs.version }}"

      - name: Build cdf
        shell: bash
        run: |
          export PYO3_PYTHON="$(command -v python)"
          case "${{ matrix.target }}" in
            *-apple-darwin)
              export RUSTFLAGS="-C link-arg=-Wl,-rpath,@loader_path -C link-arg=-Wl,-rpath,@loader_path/deps"
              ;;
            *-unknown-linux-gnu)
              export RUSTFLAGS='-C link-arg=-Wl,-rpath,$ORIGIN -C link-arg=-Wl,-rpath,$ORIGIN/deps'
              ;;
          esac
          cargo build -p cdf-cli --release --locked --target "${{ matrix.target }}" \
            --features bundled-duckdb

      - name: Verify DuckDB is statically linked
        shell: bash
        run: |
          binary="target/${{ matrix.target }}/release/${{ matrix.binary }}"
          case "${{ matrix.target }}" in
            *-apple-darwin)
              dependencies="$(otool -L "$binary")"
              ;;
            *-unknown-linux-gnu)
              dependencies="$(ldd "$binary")"
              ;;
            x86_64-pc-windows-msvc)
              vswhere="/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe"
              if [[ ! -f "$vswhere" ]]; then
                echo "vswhere is unavailable; cannot locate the MSVC dependency inspector" >&2
                exit 1
              fi
              dumpbin_windows="$("$vswhere" \
                -latest \
                -products '*' \
                -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 \
                -find 'VC\Tools\MSVC\**\bin\Hostx64\x64\dumpbin.exe' \
                | tr -d '\r' \
                | tail -1)"
              if [[ -z "$dumpbin_windows" ]]; then
                echo "MSVC dumpbin is unavailable; cannot inspect release dependencies" >&2
                exit 1
              fi
              dumpbin="$(cygpath -u "$dumpbin_windows")"
              dependencies="$("$dumpbin" //dependents "$binary")"
              ;;
          esac
          if grep -Eiq 'duckdb[^[:space:]]*\.(dll|so|dylib)' <<<"$dependencies"; then
            echo "release binary unexpectedly depends on a dynamic DuckDB library" >&2
            printf '%s\n' "$dependencies" >&2
            exit 1
          fi
          echo "DuckDB is statically linked"

      - name: Download canonical CLI artifacts
        uses: actions/download-artifact@v4
        with:
          name: cdf-${{ needs.metadata.outputs.version }}-cli-artifacts
          path: target/generated

      - name: Package release artifact
        shell: bash
        run: |
          target="${{ matrix.target }}"
          version="${{ needs.metadata.outputs.version }}"
          binary="target/${target}/release/${{ matrix.binary }}"
          case "$target" in
            *-apple-darwin)
              python_library="$(otool -L "$binary" | awk 'NR > 1 { print $1 }' | grep -E '/(libpython[^/]*\\.dylib|Python)$' | head -1)"
              python_runtime_name="libpython$(python -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")').dylib"
              ;;
            *-unknown-linux-gnu)
              python_library="$(ldd "$binary" | awk '/libpython/ { print $3; exit }')"
              python_runtime_name="$(basename "$python_library")"
              ;;
            x86_64-pc-windows-msvc)
              python_library_windows="$(python -c 'import pathlib, sys; name=f"python{sys.version_info.major}{sys.version_info.minor}.dll"; matches=list(pathlib.Path(sys.base_prefix).rglob(name)); print(matches[0] if matches else "")')"
              python_library="$(cygpath -u "$python_library_windows")"
              python_runtime_name="$(basename "$python_library")"
              ;;
          esac
          if [[ -z "$python_library" || ! -f "$python_library" ]]; then
            echo "linked Python runtime library is absent for ${target}: ${python_library:-not resolved}" >&2
            exit 1
          fi
          python_license="$(python -c 'import pathlib, sys; roots={pathlib.Path(sys.base_prefix), pathlib.Path(sys.prefix)}; matches=[path for root in roots if root.exists() for path in root.rglob("LICENSE*") if path.is_file()]; print(min(matches, key=lambda path: (len(path.parts), str(path))) if matches else "")')"
          if [[ "$target" == "x86_64-pc-windows-msvc" && -n "$python_license" ]]; then
            python_license="$(cygpath -u "$python_license")"
          fi
          if [[ -z "$python_license" || ! -f "$python_license" ]]; then
            echo "Python runtime license is absent for ${target}" >&2
            exit 1
          fi
          case "$target" in
            *-apple-darwin) export DYLD_FALLBACK_LIBRARY_PATH="$(dirname "$python_library")${DYLD_FALLBACK_LIBRARY_PATH:+:${DYLD_FALLBACK_LIBRARY_PATH}}" ;;
            *-unknown-linux-gnu) export LD_LIBRARY_PATH="$(dirname "$python_library")${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}" ;;
            x86_64-pc-windows-msvc) export PATH="$(dirname "$python_library"):${PATH}" ;;
          esac
          host="$(rustc -vV | awk '/^host:/ { print $2 }')"
          args=(
            --version "$version"
            --target "$target"
            --binary "$binary"
            --runtime-library "${python_runtime_name}=${python_library}"
            --runtime-license "Python=$python_license"
            --out-dir "dist"
          )
          if [[ -d target/generated/completions ]]; then
            args+=(--completions-dir target/generated/completions)
          fi
          if [[ -d target/generated/man ]]; then
            args+=(--man-dir target/generated/man)
          fi
          if [[ "$host" != "$target" ]]; then
            args+=(--skip-binary-run "host ${host} cannot execute ${target}")
          fi
          tools/package-release-artifact.sh "${args[@]}"

      - name: Verify target archive
        shell: bash
        run: tools/verify-release-artifacts.sh "${{ needs.metadata.outputs.version }}" dist "${{ matrix.target }}"

      - name: Upload target artifact
        uses: actions/upload-artifact@v4
        with:
          name: cdf-${{ needs.metadata.outputs.version }}-${{ matrix.target }}
          path: |
            dist/cdf-${{ needs.metadata.outputs.version }}-${{ matrix.target }}.tar.gz
            dist/cdf-${{ needs.metadata.outputs.version }}-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error

  verify:
    name: Verify release bundle
    needs:
      - metadata
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download target artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: cdf-${{ needs.metadata.outputs.version }}-*
          path: dist/release
          merge-multiple: true

      - name: Verify all archives
        shell: bash
        run: |
          targets=(
            x86_64-unknown-linux-gnu
            aarch64-unknown-linux-gnu
            x86_64-apple-darwin
            aarch64-apple-darwin
            x86_64-pc-windows-msvc
          )
          tools/verify-release-artifacts.sh "${{ needs.metadata.outputs.version }}" dist/release "${targets[@]}"
          (
            cd dist/release
            cat ./*.sha256 | sort -k2 > SHA256SUMS
            sha256sum -c SHA256SUMS
          )

      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: cdf-${{ needs.metadata.outputs.version }}-release-bundle
          path: dist/release
          if-no-files-found: error

  github-prerelease:
    name: GitHub prerelease
    needs:
      - metadata
      - verify
    if: ${{ needs.metadata.outputs.upload_github_prerelease == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download release bundle
        uses: actions/download-artifact@v4
        with:
          name: cdf-${{ needs.metadata.outputs.version }}-release-bundle
          path: dist/release

      - name: Build release notes from changelog
        shell: bash
        run: tools/verify-release-metadata.sh "${{ needs.metadata.outputs.version }}" --write-changelog-excerpt dist/release/RELEASE_NOTES.md

      - name: Publish GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.metadata.outputs.version }}
          name: CDF v${{ needs.metadata.outputs.version }}
          prerelease: true
          body_path: dist/release/RELEASE_NOTES.md
          files: |
            dist/release/*.tar.gz
            dist/release/*.sha256
            dist/release/SHA256SUMS
          fail_on_unmatched_files: true
