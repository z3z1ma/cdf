[package]
name = "cdf-source-clickhouse"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Finite ClickHouse table source adapter for cdf."

[dependencies]
arrow-array = "58.3.0"
arrow-schema = "58.3.0"
cdf-http = { path = "../cdf-http" }
cdf-kernel = { path = "../cdf-kernel" }
cdf-memory = { path = "../cdf-memory" }
cdf-runtime = { path = "../cdf-runtime" }
clickhouse = { version = "=0.15.1", features = ["rustls-tls"] }
clickhouse-ext-arrow = "=0.1.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
url = "2.5.8"

[dev-dependencies]
arrow-cast = "58.3.0"
cdf-engine = { path = "../cdf-engine" }
futures-executor = "0.3.32"
futures-util = "0.3.32"

[lints]
workspace = true
