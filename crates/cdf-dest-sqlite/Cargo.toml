[package]
name = "cdf-dest-sqlite"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "SQLite destination adapter for cdf."

[dependencies]
arrow-array = "58.3.0"
arrow-buffer = "58.3.0"
arrow-schema = "58.3.0"
cdf-contract = { path = "../cdf-contract" }
cdf-dest-sql = { path = "../cdf-dest-sql" }
cdf-kernel = { path = "../cdf-kernel" }
cdf-package-contract = { path = "../cdf-package-contract" }
cdf-runtime = { path = "../cdf-runtime" }
rusqlite = { version = "0.40.1", default-features = false, features = ["bundled", "hooks", "modern_sqlite"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.10.9"

[dev-dependencies]
cdf-engine = { path = "../cdf-engine" }
half = "2.7.1"
tempfile = "3.27.0"

[lints]
workspace = true
