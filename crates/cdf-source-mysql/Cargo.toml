[package]
name = "cdf-source-mysql"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "MySQL finite and CDC source adapter for cdf."

[dependencies]
arrow-array = "58.3.0"
arrow-schema = "58.3.0"
base64 = "0.22.1"
cdf-http = { path = "../cdf-http" }
cdf-kernel = { path = "../cdf-kernel" }
cdf-memory = { path = "../cdf-memory" }
cdf-runtime = { path = "../cdf-runtime" }
mysql_async = { version = "0.37.0", default-features = false, features = ["default-rustls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sqlparser = { version = "0.62.0", features = ["visitor"] }
url = "2.5.8"

[dev-dependencies]
futures-executor = "0.3.32"
futures-util = "0.3.32"

[lints]
workspace = true
