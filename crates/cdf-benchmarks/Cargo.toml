[package]
name = "cdf-benchmarks"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Opt-in local benchmark harness for cdf."

[features]
bundled-duckdb = [
    "cdf-builtin-drivers/bundled-duckdb",
    "cdf-dest-duckdb/bundled-duckdb",
    "duckdb/bundled",
]

[dependencies]
arrow-array = "58.3.0"
arrow-buffer = "58.3.0"
arrow-csv = "58.3.0"
arrow-ipc = { version = "58.3.0", features = ["lz4"] }
arrow-json = "58.3.0"
arrow-schema = "58.3.0"
arrow-select = "58.3.0"
clap = { version = "4.6.1", default-features = false, features = ["std", "help", "usage", "error-context"] }
cdf-bench-core = { path = "../cdf-bench-core" }
cdf-builtin-drivers = { path = "../cdf-builtin-drivers" }
cdf-contract = { path = "../cdf-contract" }
cdf-declarative = { path = "../cdf-declarative" }
cdf-dest-clickhouse = { path = "../cdf-dest-clickhouse" }
cdf-dest-postgres = { path = "../cdf-dest-postgres" }
cdf-dest-sqlite = { path = "../cdf-dest-sqlite" }
cdf-dest-duckdb = { path = "../cdf-dest-duckdb" }
cdf-dest-parquet = { path = "../cdf-dest-parquet" }
cdf-engine = { path = "../cdf-engine" }
cdf-foreign-stream = { path = "../cdf-foreign-stream" }
cdf-http = { path = "../cdf-http" }
cdf-kernel = { path = "../cdf-kernel" }
cdf-package = { path = "../cdf-package" }
cdf-package-contract = { path = "../cdf-package-contract" }
cdf-project = { path = "../cdf-project" }
cdf-runtime = { path = "../cdf-runtime" }
cdf-memory = { path = "../cdf-memory" }
cdf-object-access = { path = "../cdf-object-access" }
cdf-source-clickhouse = { path = "../cdf-source-clickhouse" }
cdf-source-files = { path = "../cdf-source-files" }
cdf-source-iceberg = { path = "../cdf-source-iceberg" }
cdf-source-mongodb = { path = "../cdf-source-mongodb" }
cdf-source-postgres = { path = "../cdf-source-postgres" }
cdf-source-rest = { path = "../cdf-source-rest" }
cdf-source-sqlite = { path = "../cdf-source-sqlite" }
cdf-state-sqlite = { path = "../cdf-state-sqlite" }
cdf-transport-http = { path = "../cdf-transport-http" }
clickhouse = { version = "=0.15.1", features = ["rustls-tls"] }
clickhouse-ext-arrow = "=0.1.0"
datafusion = { version = "54.0.0", default-features = false }
duckdb = { workspace = true, features = ["appender-arrow"] }
futures-executor = "0.3.32"
futures-util = "0.3.32"
fallible-iterator = "0.2.0"
hex = "0.4.3"
mongodb = { version = "=3.8.0", default-features = false, features = ["compat-3-3-0", "bson-3", "dns-resolver", "rustls-tls"] }
nix = { version = "0.31.3", default-features = false, features = ["resource"] }
parquet = { version = "58.3.0", default-features = false, features = ["arrow"] }
postgres = "0.19.14"
rusqlite = { version = "0.40.1", default-features = false, features = ["bundled", "modern_sqlite"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.10.9"
tempfile = "3.27.0"
tokio = { version = "=1.52.3", features = ["rt-multi-thread"] }
url = "2.5.8"

[dev-dependencies]
criterion = "0.5.1"

[[bench]]
name = "baseline"
harness = false

[lints]
workspace = true
