[package]
name = "cdf-project"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Project configuration and orchestration boundary for cdf."

[dependencies]
arrow-array = "58.3.0"
arrow-cast = "58.3.0"
arrow-schema = "58.3.0"
cdf-contract = { path = "../cdf-contract" }
cdf-declarative = { path = "../cdf-declarative" }
cdf-engine = { path = "../cdf-engine" }
cdf-http = { path = "../cdf-http" }
cdf-kernel = { path = "../cdf-kernel" }
cdf-memory = { path = "../cdf-memory" }
cdf-package = { path = "../cdf-package" }
cdf-package-contract = { path = "../cdf-package-contract" }
cdf-runtime = { path = "../cdf-runtime" }
cdf-semantic = { path = "../cdf-semantic" }
cdf-state-sqlite = { path = "../cdf-state-sqlite" }
hex = "0.4.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.10.9"
toml = "1.1.2"
tracing = "0.1.44"
futures-executor = "0.3.32"

[target.'cfg(unix)'.dependencies]
libc = "0.2.186"

[dev-dependencies]
arrow-array = "58.3.0"
arrow-ipc = "58.3.0"
bytes = "1.11.0"
cdf-builtin-drivers = { path = "../cdf-builtin-drivers" }
cdf-dest-duckdb = { path = "../cdf-dest-duckdb" }
cdf-dest-parquet = { path = "../cdf-dest-parquet" }
cdf-dest-postgres = { path = "../cdf-dest-postgres" }
cdf-format-avro = { path = "../cdf-format-avro" }
cdf-object-access = { path = "../cdf-object-access" }
cdf-source-files = { path = "../cdf-source-files" }
cdf-source-postgres = { path = "../cdf-source-postgres" }
cdf-source-rest = { path = "../cdf-source-rest" }
flate2 = "1.1.9"
futures-util = "0.3.32"
object_store = { git = "https://github.com/apache/arrow-rs-object-store.git", rev = "c7316d29face118e7409eead0cda098f38589428" }
postgres = "0.19"
proptest = "1.11.0"
proc-macro2 = "1.0.107"
syn = { version = "2.0.117", features = ["full", "visit"] }
tempfile = "3.27.0"

[lints]
workspace = true
