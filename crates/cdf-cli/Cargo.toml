[package]
name = "cdf-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Command-line entry point for cdf."

[[bin]]
name = "cdf"
path = "src/main.rs"

[features]
bundled-duckdb = ["cdf-builtin-drivers/bundled-duckdb"]

[dependencies]
arrow-array = "58.3.0"
arrow-schema = "58.3.0"
cdf-builtin-drivers = { path = "../cdf-builtin-drivers" }
cdf-cli-core = { path = "../cdf-cli-core" }
cdf-contract = { path = "../cdf-contract" }
cdf-declarative = { path = "../cdf-declarative" }
cdf-dest-duckdb = { path = "../cdf-dest-duckdb" }
cdf-engine = { path = "../cdf-engine" }
cdf-http = { path = "../cdf-http" }
cdf-kernel = { path = "../cdf-kernel" }
cdf-memory = { path = "../cdf-memory" }
cdf-package = { path = "../cdf-package" }
cdf-package-contract = { path = "../cdf-package-contract" }
cdf-project = { path = "../cdf-project" }
cdf-runtime = { path = "../cdf-runtime" }
cdf-semantic = { path = "../cdf-semantic" }
cdf-state-sqlite = { path = "../cdf-state-sqlite" }
futures-util = "0.3.32"
glob = "0.3.3"
mimalloc = { version = "0.1.52", default-features = false }
rusqlite = { version = "0.40.1", default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.10.9"
tempfile = "3.27.0"
toml = "1.1.2"
url = "2.5.8"
uuid = { version = "1.24.0", features = ["v4"] }

[dev-dependencies]
arrow-ipc = "58.3.0"
cdf-dest-parquet = { path = "../cdf-dest-parquet" }
duckdb.workspace = true
postgres = "0.19"

[lints]
workspace = true
